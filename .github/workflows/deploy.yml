name: Testes e deploy na VM Oracle

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Testes das formulas (Node)
        run: node tests/test_hospital_calc.mjs
      - name: Testes dos robos (Python)
        run: |
          git clone --depth 1 https://github.com/rafaelpartelli/sala-gestao /tmp/sala-gestao
          ROBO_EXTRA=/tmp/sala-gestao/robo python3 -I -m unittest discover -s tests -p "test_hospital.py"
      - name: Montagem da plataforma (teste de sintaxe)
        run: bash -n deploy/instalar_oracle.sh && python3 -c "import ast,sys;ast.parse(open('deploy/montar_plataforma.py').read())"

  deploy:
    needs: testes
    runs-on: ubuntu-latest
    environment: producao
    concurrency: deploy-vm
    steps:
      - uses: actions/checkout@v4
      - name: Chave e host da VM
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST_KEY: ${{ secrets.VM_HOST_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VM_HOST_KEY" | sed "s/^\[HOST\]/$VM_HOST/" > ~/.ssh/known_hosts
      - name: Enviar e instalar na VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          git archive --format=tar.gz HEAD | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VM_USER@$VM_HOST"
